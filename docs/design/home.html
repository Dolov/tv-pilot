<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>tv-pilot · 首页方向稿</title>
<link rel="stylesheet" href="app.css">
<style>
  /* 首页专属：标题与带子之间的呼吸、菜单区起点 */
  .tape-block { margin-top: 40px; }
  .menu { margin-top: 64px; }
</style>
</head>
<body>
<div class="room">
  <div class="page">

    <header class="hd">
      <div class="brand">tv-pilot<span class="dot">.</span></div>
      <div class="meta">2026-11-06 周五 · 本机数据 · 仅存本地</div>
    </header>

    <div class="title-row">
      <h1>使用台账</h1>
      <div class="eyebrow-right micro">TV LEDGER · 本机</div>
    </div>

    <!-- 签名元素：一天一条带。首页只给「今天」，不写细刻度 -->
    <section class="tape-block">
      <div class="tape-head">
        <div class="k">今日 · 24 小时</div>
        <div class="v">1:46<small>合计</small></div>
      </div>

      <div class="tape">
        <div class="track"></div>
        <!-- 09:12 → 09:26 视频 14m / 15:40 → 15:58 视频 18m / 16:18 → 16:53 视频 35m
             17:20 → 17:32 音乐 12m / 18:05 → 18:20 儿童学习 15m / 19:52 → 20:04 系统 12m
             24h = 1440min，宽度 1728px → 1.2px/min -->
        <div class="seg" style="left:1173.6px; width:42px;   background:var(--video)"></div>
        <div class="seg" style="left:1230px;   width:14.4px; background:var(--music)"></div>
        <div class="seg" style="left:1260px;   width:18px;   background:var(--kids)"></div>
        <div class="seg" style="left:1308px;   width:12px;   background:var(--video)"></div>
        <div class="seg" style="left:1344px;   width:26.4px; background:var(--video)"></div>
        <div class="seg" style="left:1430.4px; width:14.4px; background:var(--system)"></div>
        <div class="playhead" style="left:1444.8px"></div>
      </div>

      <div class="ticks">
        <div class="tick major" style="left:0"></div><div class="t" style="left:-4px">0</div>
        <div class="tick" style="left:216px"></div>
        <div class="tick" style="left:432px"></div><div class="t" style="left:424px">6</div>
        <div class="tick" style="left:648px"></div>
        <div class="tick" style="left:864px"></div><div class="t" style="left:856px">12</div>
        <div class="tick" style="left:1080px"></div>
        <div class="tick" style="left:1296px"></div><div class="t" style="left:1288px">18</div>
        <div class="tick" style="left:1512px"></div>
        <div class="tick" style="left:1728px"></div><div class="t" style="left:1720px">24</div>
      </div>

      <div class="legend">
        <div class="item"><span class="swatch" style="background:var(--video)"></span><span class="name">视频</span><span class="val">1:07</span></div>
        <div class="item"><span class="swatch" style="background:var(--music)"></span><span class="name">音乐</span><span class="val">0:12</span></div>
        <div class="item"><span class="swatch" style="background:var(--kids)"></span><span class="name">儿童学习</span><span class="val">0:15</span></div>
        <div class="item"><span class="swatch" style="background:var(--system)"></span><span class="name">桌面/系统</span><span class="val">0:12</span></div>
        <div class="item"><span class="name" style="color:var(--text-3)">·  屏保、熄屏不计入</span></div>
      </div>
    </section>

    <nav class="menu">
      <div class="row focused">
        <span class="spine"></span>
        <span class="idx">01</span>
        <span class="name">使用记录</span>
        <span class="desc">今日 · 历史 · 左右键切换日期</span>
        <span class="chev">›</span>
      </div>
      <div class="row">
        <span class="spine"></span>
        <span class="idx">02</span>
        <span class="name">使用报告</span>
        <span class="desc">周报 · 月报 · 年报，趋势与构成</span>
        <span class="chev">›</span>
      </div>
      <div class="row">
        <span class="spine"></span>
        <span class="idx">03</span>
        <span class="name">我的宠物</span>
        <span class="desc">照顾 · 商店 · 换装 · 进化</span>
        <span class="chev">›</span>
      </div>
      <div class="row">
        <span class="spine"></span>
        <span class="idx">04</span>
        <span class="name">家长设置</span>
        <span class="desc">每场时长 · 每天场次 · 允许时段 · 视觉主题</span>
        <span class="tag">PIN</span>
      </div>
    </nav>

    <footer class="foot">
      <div class="keys">
        <span><span class="key">↑</span> <span class="key">↓</span> 选择</span>
        <span><span class="key">OK</span> 进入</span>
      </div>
      <div class="ver">v1.24 · TV PILOT</div>
    </footer>

  </div>
</div>
</body>
</html>
